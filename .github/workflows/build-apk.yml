name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'sanguosha_chuanqi_prototype_buildable-1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare project
        run: |
          mkdir project
          unzip sanguosha_chuanqi_prototype_buildable-1.zip -d project
          find project -maxdepth 4 -type f | head -100

      - name: Check project files
        run: |
          find project -type f | head -200
          test -n "$(find project -name 'build.gradle' -o -name 'build.gradle.kts')"

      - name: Build APK
        run: |
          cd "$(dirname "$(find "$GITHUB_WORKSPACE/project" -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -1)")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanguosha-chuanqi-apk
          path: project/**/build/outputs/apk/**/*.apk
